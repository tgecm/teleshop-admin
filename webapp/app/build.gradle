apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.crossmartmm.shop'
    compileSdk 36

    defaultConfig {
        applicationId 'com.crossmartmm.shop'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties.getProperty('storeFile',
                System.getenv('KEYSTORE_FILE') ?: rootProject.file('webapp.keystore').absolutePath))
            storePassword keystoreProperties.getProperty('storePassword',
                System.getenv('KEYSTORE_PASSWORD') ?: 'teleshop123')
            keyAlias keystoreProperties.getProperty('keyAlias',
                System.getenv('KEY_ALIAS') ?: 'webapp')
            keyPassword keystoreProperties.getProperty('keyPassword',
                System.getenv('KEY_PASSWORD') ?: 'teleshop123')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-messaging'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
