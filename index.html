<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6366f1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://api.telegramecommerce.shop https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none';" />
    <title>E-commerce Myanmar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <script>
      document.addEventListener('gesturestart', e => e.preventDefault());
      document.addEventListener('contextmenu', e => {
        // Allow native copy/paste menu in form fields
        if (e.target.closest('input, textarea, [contenteditable]')) return;
        e.preventDefault();
      });
      // Prevent text selection on non-input elements
      document.addEventListener('selectstart', e => {
        if (!e.target.closest('input, textarea, [contenteditable]')) {
          e.preventDefault();
        }
      });
      document.addEventListener('dragstart', e => {
        if (!e.target.closest('input, textarea, [contenteditable]')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
