<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<title>Add Product</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overscroll-behavior: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  background: linear-gradient(135deg, #eef2ff 0%, #fff 50%, #faf5ff 100%);
  padding: 16px;
  display: flex;
  justify-content: center;
}
.container { max-width: 448px; width: 100%; padding: 32px 0; }

.card {
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  overflow: hidden;
}
.card-header {
  background: linear-gradient(135deg, #6366f1, #9333ea);
  padding: 24px;
  text-align: center;
}
.card-header .icon-wrap {
  width: 56px; height: 56px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(4px);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
  border: 1px solid rgba(255,255,255,0.2);
}
.card-header h1 { color: #fff; font-size: 20px; font-weight: 700; }
.card-header p { color: #c7d2fe; font-size: 14px; margin-top: 4px; }
.card-body { padding: 24px; }

.loading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 64px 0;
}
.spinner {
  width: 48px; height: 48px;
  border: 3px solid #e0e7ff;
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-wrap p { font-size: 14px; color: #9ca3af; font-weight: 500; }

.center-card { text-align: center; padding: 16px 0; }
.icon-circle {
  width: 80px; height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}
.center-card h2 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 8px; }
.center-card p { font-size: 14px; color: #6b7280; margin-bottom: 24px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: 16px;
  font-weight: 700;
  font-size: 14px;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-ghost { background: #f3f4f6; color: #374151; }
.btn-ghost:hover { background: #e5e7eb; }
.btn-primary {
  background: linear-gradient(135deg, #6366f1, #9333ea);
  color: #fff;
  box-shadow: 0 4px 12px rgba(99,102,241,0.2);
}
.btn-primary:hover { box-shadow: 0 6px 16px rgba(99,102,241,0.3); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-outline {
  background: rgba(238,242,255,0.5);
  border: 2px dashed #a5b4fc;
  color: #6366f1;
  width: 100%;
  justify-content: center;
}
.btn-outline:hover { background: #eef2ff; }
.btn-block { width: 100%; justify-content: center; }
.btn-sm { padding: 8px 12px; font-size: 12px; border-radius: 12px; }

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  color: #374151;
  margin-left: 4px;
  margin-bottom: 6px;
}
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 12px 16px;
  background: #f9fafb;
  border: 1px solid #f3f4f6;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 500;
  outline: none;
  transition: box-shadow 0.15s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  box-shadow: 0 0 0 2px #6366f1;
}
.form-textarea { resize: none; min-height: 72px; }
.form-row { display: flex; gap: 12px; padding-top: 16px; }
.form-row .btn-flex-1 { flex: 1; }
.form-row .btn-flex-2 { flex: 2; }

.error-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: 16px;
  margin-bottom: 16px;
}
.error-banner svg { width: 20px; height: 20px; color: #f87171; flex-shrink: 0; }
.error-banner p { font-size: 14px; font-weight: 500; color: #b91c1c; }

/* Category */
.category-row { display: flex; gap: 8px; }
.category-row .form-select { flex: 1; }
.create-cat-wrap { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.create-cat-wrap input { flex: 1; }

/* Stock pills */
.stock-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.stock-pill {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid #e5e7eb;
  background: #f9fafb;
  color: #6b7280;
  cursor: pointer;
  transition: all 0.15s;
}
.stock-pill.active {
  background: #6366f1;
  color: #fff;
  border-color: #6366f1;
}

/* Photo grid */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}
.photo-item {
  position: relative;
  aspect-ratio: 1;
}
.photo-item img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
}
.photo-remove {
  position: absolute;
  top: -6px; right: -6px;
  width: 20px; height: 20px;
  background: #f43f5e;
  color: #fff;
  border: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.photo-upload-area {
  width: 100%;
  padding: 40px 0;
  border: 2px dashed #e5e7eb;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.15s;
  background: none;
  font-family: inherit;
}
.photo-upload-area:hover { border-color: #a5b4fc; background: rgba(238,242,255,0.3); }
.photo-upload-area svg { width: 28px; height: 28px; color: #d1d5db; }
.photo-upload-area span { font-weight: 700; font-size: 14px; color: #6b7280; }
.photo-upload-sm {
  padding: 12px 0;
  border: 2px dashed #e5e7eb;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: all 0.15s;
  background: none;
  font-family: inherit;
  width: 100%;
}
.photo-upload-sm:hover { border-color: #a5b4fc; background: rgba(238,242,255,0.3); }
.photo-upload-sm svg { width: 20px; height: 20px; color: #d1d5db; }
.photo-upload-sm span { font-weight: 700; font-size: 12px; color: #6b7280; }

.footer { text-align: center; margin-top: 24px; }
.footer-brand { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.footer-brand .brand-icon {
  width: 20px; height: 20px;
  background: #6366f1;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.footer-brand .brand-icon svg { width: 12px; height: 12px; color: #fff; }
.footer-brand span { font-size: 12px; font-weight: 700; color: #6b7280; }
.footer > p { font-size: 10px; color: #9ca3af; }
</style>
</head>
<body>
<div class="container" id="root"></div>

<script>
function qs(key) {
  return new URLSearchParams(window.location.search).get(key) || '';
}

const u = qs('u'), c = qs('c'), s1 = qs('s1'), s2 = qs('s2');

const icons = {
  package: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.89 1.45l8 4A2 2 0 0 1 22 7.24v9.53a2 2 0 0 1-1.11 1.79l-8 4a2 2 0 0 1-1.79 0l-8-4a2 2 0 0 1-1.1-1.8V7.24a2 2 0 0 1 1.11-1.79l8-4a2 2 0 0 1 1.78 0z"/><polyline points="2.32 6.16 12 11 21.68 6.16"/><line x1="12" y1="22.76" x2="12" y2="11"/></svg>',
  alertCircle: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  checkCircle: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  imageUp: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><path d="M18 14v6"/><path d="M21 20l-3-3-3 3"/></svg>',
  x: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  shoppingBag: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
  chevronRight: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  folderPlus: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>',
  loader2: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
};

function iconSvg(name, size) {
  return icons[name].replace('width="24"', 'width="' + size + '"').replace('height="24"', 'height="' + size + '"');
}

let state = 'loading', botInfo = null, categories = [], images = [], errorMsg = '';
let formData = { name: '', description: '', price: '', category_id: '' };
let stockOption = 'unlimited', customStock = '', showNewCategory = false, newCategoryName = '';
let result = null, submitting = false;

const API = window.location.origin;

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const root = document.getElementById('root');
  if (state === 'loading') {
    root.innerHTML = '<div class="card"><div class="loading-wrap">' +
      '<div class="spinner"></div>' +
      '<p>Loading, If slow, use VPN</p>' +
    '</div></div>';
    return;
  }
  if (state === 'error') {
    root.innerHTML = '<div class="card"><div class="card-body"><div class="center-card">' +
      '<div class="icon-circle" style="background:linear-gradient(135deg,#fef2f2,#fee2e2)">' + iconSvg('alertCircle', 40) + '</div>' +
      '<h2>Invalid Link</h2>' +
      '<p>Please add product using your mobile phone</p>' +
      '<a href="https://t.me/tg_ecommerce_official_bot" target="_blank" class="btn btn-ghost">Contact Support' + iconSvg('chevronRight', 16) + '</a>' +
    '</div></div></div>';
    return;
  }
  if (state === 'limit_reached') {
    root.innerHTML = '<div class="card"><div class="card-body"><div class="center-card">' +
      '<div class="icon-circle" style="background:linear-gradient(135deg,#fffbeb,#fef3c7)">' + iconSvg('alertCircle', 40) + '</div>' +
      '<h2>Limit Reached</h2>' +
      '<p>You have reached your limit of adding new product. To add more, please upgrade!</p>' +
      '<a href="https://t.me/tg_ecommerce_official_bot" target="_blank" class="btn btn-primary">Contact Support to Upgrade' + iconSvg('chevronRight', 16) + '</a>' +
    '</div></div></div>';
    return;
  }
  if (state === 'success') {
    const p = result ? formatPrice(result.price, (botInfo && botInfo.currency) || 'MMK') : '';
    root.innerHTML = '<div class="card" style="background:linear-gradient(135deg,#ecfdf5,#f0fdfa);padding:24px"><div class="center-card">' +
      '<div class="icon-circle" style="background:linear-gradient(135deg,#ecfdf5,#d1fae5)">' + iconSvg('checkCircle', 40) + '</div>' +
      '<h2>Product Submitted!</h2>' +
      '<p>Your product has been submitted successfully.</p>' +
      (result ? '<div style="background:#f9fafb;border-radius:16px;padding:16px;margin-bottom:24px;text-align:left;border:1px solid #f3f4f6">' +
        '<p style="font-weight:700;color:#111827;font-size:14px">' + esc(result.name) + '</p>' +
        '<p style="font-size:18px;font-weight:700;color:#059669;margin-top:4px">' + p + '</p></div>' : '') +
      '<p style="font-size:12px;color:#9ca3af">The shop owner will review your product shortly.</p>' +
      '<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="addAnother()">' + iconSvg('package', 16) + ' Add Another Product</button>' +
    '</div></div>';
    return;
  }

  // Form state
  const shopName = (botInfo && botInfo.bot_full_name) || 'Shop';
  const currency = (botInfo && botInfo.currency) || 'MMK';
  const isValid = formData.name.trim() && formData.price && formData.category_id;
  const catLimit = botInfo && botInfo.limits && botInfo.counts && botInfo.limits.categories !== null && botInfo.counts.categories >= botInfo.limits.categories;

  let html = '<div class="card">' +
    '<div class="card-header">' +
      '<div class="icon-wrap">' + iconSvg('package', 28) + '</div>' +
      '<h1>Add Product</h1>' +
      '<p>' + esc(shopName) + '</p>' +
    '</div>' +
    '<div class="card-body">';

  if (errorMsg) {
    html += '<div class="error-banner">' + iconSvg('alertCircle', 20) + '<p>' + esc(errorMsg) + '</p></div>';
  }

  // Category
  html += '<div class="form-group">' +
    '<label>Category *</label>' +
    '<div class="category-row">' +
      '<select class="form-select" id="f-category">' +
        '<option value="">Select Category</option>';
  categories.forEach(cat => {
    html += '<option value="' + cat.id + '"' + (String(cat.id) === formData.category_id ? ' selected' : '') + '>' + esc(cat.name) + '</option>';
  });
  html += '</select></div>';

  if (catLimit) {
    html += '<p style="font-size:12px;font-weight:500;color:#d97706;text-align:center;padding:4px 0">You cannot add new category. Your category reached the limit.</p>';
  } else if (!showNewCategory) {
    html += '<button class="btn btn-outline btn-sm" style="margin-top:4px" onclick="toggleNewCat()">' + iconSvg('folderPlus', 16) + ' + Create New Category</button>';
  }

  if (showNewCategory && !catLimit) {
    html += '<div class="create-cat-wrap">' +
      '<input class="form-input" type="text" id="f-new-cat" placeholder="Category name" value="' + esc(newCategoryName) + '">' +
      '<button class="btn btn-primary btn-sm" id="save-cat-btn" onclick="createCategory()">Save</button>' +
      '<button class="btn btn-ghost btn-sm" onclick="toggleNewCat()">Cancel</button>' +
    '</div>';
  }

  html += '</div>';

  // Product name
  html += '<div class="form-group">' +
    '<label>Product Name *</label>' +
    '<input class="form-input" type="text" id="f-name" placeholder="e.g. Premium Coffee Beans" value="' + esc(formData.name) + '">' +
  '</div>';

  // Price
  html += '<div class="form-group">' +
    '<label>Price (' + currency + ') *</label>' +
    '<input class="form-input" type="number" id="f-price" placeholder="0" value="' + esc(formData.price) + '">' +
  '</div>';

  // Stock
  const stockOpts = [
    { value: 'unlimited', label: 'In stock' },
    { value: 'out', label: 'Out of Stock' },
    { value: 'custom', label: 'Add' },
  ];
  html += '<div class="form-group">' +
    '<label>Stock</label>' +
    '<div class="stock-pills" id="stock-pills">';
  stockOpts.forEach(opt => {
    html += '<div class="stock-pill' + (stockOption === opt.value ? ' active' : '') + '" data-value="' + opt.value + '">' + opt.label + '</div>';
  });
  html += '</div>';
  if (stockOption === 'custom') {
    html += '<input class="form-input" type="number" min="0" id="f-custom-stock" placeholder="Enter quantity" value="' + esc(customStock) + '" style="margin-top:8px">';
  }
  html += '</div>';

  // Description
  html += '<div class="form-group">' +
    '<label>Description</label>' +
    '<textarea class="form-textarea" id="f-desc" placeholder="Describe your product...">' + esc(formData.description) + '</textarea>' +
  '</div>';

  // Photos
  html += '<div class="form-group">' +
    '<label>Photos <span style="font-weight:400;color:#9ca3af">(' + images.length + '/10)</span></label>' +
    '<input type="file" id="f-photo" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none">';

  if (images.length > 0) {
    if (images.length === 1) {
      html += '<div style="display:flex;justify-content:center;">' + photoItemHtml(images[0], 0) + '</div>';
    } else {
      html += '<div class="photo-grid">';
      images.forEach((img, i) => { html += photoItemHtml(img, i); });
      html += '</div>';
    }
  }

  if (images.length === 0) {
    html += '<button class="photo-upload-area" id="upload-btn" onclick="document.getElementById(\'f-photo\').click()">' +
      iconSvg('imageUp', 28) + '<span>Upload Photos</span></button>';
  } else if (images.length < 10) {
    html += '<button class="photo-upload-sm" id="upload-btn" onclick="document.getElementById(\'f-photo\').click()">' +
      iconSvg('imageUp', 20) + '<span>Add More</span></button>';
  }

  html += '</div>';

  // Action buttons
  html += '<div class="form-row">' +
      '<button class="btn btn-ghost btn-flex-1" onclick="resetForm()">Reset</button>' +
      '<button class="btn btn-primary btn-flex-2" id="submit-btn" ' + (isValid ? '' : 'disabled') + ' onclick="submitForm()">Submit Product</button>' +
    '</div>' +
  '</div></div>';

  // Footer
  html += '<div class="footer"><div class="footer-brand"><div class="brand-icon">' + iconSvg('shoppingBag', 12) + '</div><span>Telegram E-Commerce</span></div>' +
    '<p>Powered by Telegram E-Commerce Platform</p></div>';

  root.innerHTML = html;

  // Bind events
  document.getElementById('f-category').addEventListener('change', function() { formData.category_id = this.value; updateSubmitBtn(); });
  document.getElementById('f-name').addEventListener('input', function() { formData.name = this.value; updateSubmitBtn(); });
  document.getElementById('f-price').addEventListener('input', function() { formData.price = this.value; updateSubmitBtn(); });
  document.getElementById('f-desc').addEventListener('input', function() { formData.description = this.value; });
  document.getElementById('f-photo').addEventListener('change', handlePhotoUpload);

  document.querySelectorAll('#stock-pills .stock-pill').forEach(el => {
    el.addEventListener('click', function() {
      stockOption = this.dataset.value;
      render();
    });
  });

  if (showNewCategory && document.getElementById('f-new-cat')) {
    document.getElementById('f-new-cat').addEventListener('input', function() { newCategoryName = this.value; });
  }
}

function photoItemHtml(img, idx) {
  return '<div class="photo-item">' +
    '<img src="' + API + '/telegram/file/' + encodeURIComponent(img.file_id) + '?bot_id=' + botInfo.bot_id + '" alt="Photo">' +
    '<button class="photo-remove" onclick="removePhoto(' + idx + ')">' + iconSvg('x', 12) + '</button>' +
  '</div>';
}

function updateSubmitBtn() {
  const btn = document.getElementById('submit-btn');
  if (btn) btn.disabled = !(formData.name.trim() && formData.price && formData.category_id);
}

function toggleNewCat() {
  showNewCategory = !showNewCategory;
  newCategoryName = '';
  render();
}

function createCategory() {
  const name = newCategoryName.trim();
  if (!name) return;
  const btn = document.getElementById('save-cat-btn');
  btn.disabled = true;
  btn.innerHTML = iconSvg('loader2', 16);

  fetch(API + '/public/categories', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, code: c, name: name, secret1: s1, secret2: s2 })
  })
  .then(r => r.json())
  .then(data => {
    if (!data.id) throw new Error();
    categories.push({ id: data.id, name: data.name });
    formData.category_id = String(data.id);
    showNewCategory = false;
    newCategoryName = '';
    render();
  })
  .catch(() => { render(); });
}

function removePhoto(idx) {
  images = images.filter((_, i) => i !== idx);
  render();
}

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file || images.length >= 10) return;
  const uploadBtn = document.getElementById('upload-btn');
  if (uploadBtn) uploadBtn.innerHTML = iconSvg('loader2', 28) + '<span>Uploading...</span>';

  compressImage(file).then(compressed => {
    const fd = new FormData();
    fd.append('file', compressed);
    fd.append('bot_id', botInfo.bot_id);
    return fetch(API + '/public/upload/photo', { method: 'POST', body: fd });
  })
  .then(r => r.json())
  .then(data => {
    images.push({ file_id: data.file_id, type: 'photo' });
    render();
  })
  .catch(() => { render(); });
}

function compressImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const max = 720;
      if (w <= max && h <= max) { resolve(file); return; }
      if (w > h) { h = Math.round(h * (max / w)); w = max; }
      else { w = Math.round(w * (max / h)); h = max; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(b => resolve(new File([b], file.name, { type: 'image/jpeg' })), 'image/jpeg', 0.8);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

function formatPrice(val, cur) {
  if (!val) return '0 ' + cur;
  const n = Number(val);
  if (cur === 'MMK') return n.toLocaleString('en-US') + ' ' + cur;
  return n.toFixed(2) + ' ' + cur;
}

function resetForm() {
  formData = { name: '', description: '', price: '', category_id: '' };
  images = [];
  errorMsg = '';
  stockOption = 'unlimited';
  customStock = '';
  showNewCategory = false;
  newCategoryName = '';
  render();
}

function addAnother() {
  state = 'form';
  formData = { name: '', description: '', price: '', category_id: '' };
  images = [];
  errorMsg = '';
  stockOption = 'unlimited';
  customStock = '';
  showNewCategory = false;
  newCategoryName = '';
  result = null;
  render();
}

function submitForm() {
  if (submitting || !formData.name.trim() || !formData.category_id) return;
  submitting = true;
  errorMsg = '';
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = iconSvg('loader2', 20) + ' Submitting...';

  const imageUrl = images.length > 0 ? JSON.stringify(images.map(img => ({ file_id: img.file_id, type: 'photo' }))) : null;
  const stockQty = stockOption === 'unlimited' ? null : stockOption === 'out' ? 0 : Number(customStock);

  fetch(API + '/public/products', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: u, code: c, secret1: s1, secret2: s2,
      name: formData.name.trim(),
      description: formData.description.trim() || null,
      price: Number(formData.price),
      original_price: null,
      stock_quantity: stockQty,
      category_id: Number(formData.category_id),
      image_url: imageUrl,
    })
  })
  .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
  .then(res => {
    if (!res.ok) {
      errorMsg = res.data.detail || 'Failed to create product';
      submitting = false;
      render();
      return;
    }
    result = res.data;
    state = 'success';
    render();
  })
  .catch(() => {
    errorMsg = 'Something went wrong. Please try again.';
    submitting = false;
    render();
  });
}

// Init
if (!u || !c) {
  state = 'error';
  render();
} else {
  fetch(API + '/public/bot-resolve/' + encodeURIComponent(u) + '/' + encodeURIComponent(c) + '?secret1=' + encodeURIComponent(s1) + '&secret2=' + encodeURIComponent(s2))
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => {
      botInfo = data;
      const cats = data.categories || [];
      categories = cats;
      if (cats.length === 0) showNewCategory = true;
      if (data.limits && data.counts && data.limits.products !== null && data.counts.products >= data.limits.products) {
        state = 'limit_reached';
      } else {
        state = 'form';
      }
      render();
    })
    .catch(() => { state = 'error'; render(); });
}
</script>
