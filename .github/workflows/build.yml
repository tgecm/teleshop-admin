name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Set version from run number
        run: |
          # versionCode = run number, versionName = 1.0.<run_number>
          VC=${{ github.run_number }}
          VN="1.0.$VC"
          sed -i "s/versionCode [0-9]*/versionCode $VC/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VN\"/" android/app/build.gradle
          sed -i "s/\"version\": \".*\"/\"version\": \"$VN\"/" package.json
          echo "Version: $VN (code: $VC)"

      - name: Build React app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Java version after sync
        run: find android node_modules/@capacitor/android -name "*.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} \;

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/mm-shop.apk
