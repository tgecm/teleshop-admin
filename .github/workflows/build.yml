name: Build Android APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install

      - name: Set version from run number
        run: |
          VC=${{ github.run_number }}
          VN="1.0.$VC"
          sed -i "s/versionCode [0-9]*/versionCode $VC/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VN\"/" android/app/build.gradle
          sed -i "s/\"version\": \".*\"/\"version\": \"$VN\"/" package.json
          echo "Version: $VN (code: $VC)"

      - name: Build React app
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Fix Java version after sync
        run: find android node_modules/@capacitor/android -name "*.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} \;
      - name: Generate debug keystore
        run: |
          if [ ! -f android/mm-shop.keystore ]; then
            keytool -genkey -v -keystore android/mm-shop.keystore \
              -storepass teleshop123 -alias mm-shop -keypass teleshop123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          fi
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mm-shop
          path: android/app/build/outputs/apk/debug/mm-shop.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TeleshopAdmin v1.0.${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/mm-shop.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
